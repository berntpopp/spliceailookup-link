# Production hardening overlay for spliceailookup-link (GeneFoundry Container &
# Deployment Hardening Standard v1).
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# Layered on the base compose: drops the published host port (expose-only behind
# the reverse proxy), makes the root filesystem read-only with an explicit
# writable scratch tmpfs, drops all kernel capabilities, blocks privilege
# escalation, and bounds memory/CPU/PIDs. This is a light, stateless proxy to the
# Broad SpliceAI Lookup / Pangolin / Ensembl services — no local models, no DB.
services:
  spliceailookup-link:
    build: !reset null
    image: "${SPLICEAILOOKUP_LINK_IMAGE:?Set SPLICEAILOOKUP_LINK_IMAGE to ghcr.io/berntpopp/spliceailookup-link@sha256:<digest>}"
    pull_policy: missing

    environment:
      GF_HEALTHCHECK_HOST: localhost
      SPLICEAILOOKUP_LINK_LOG_LEVEL: INFO
      SPLICEAILOOKUP_LINK_LOG_FORMAT: json
      SPLICEAILOOKUP_LINK_ALLOWED_HOSTS: '["localhost","127.0.0.1","::1","spliceailookup-link.genefoundry.org"]'
      SPLICEAILOOKUP_LINK_ALLOWED_ORIGINS: '["https://spliceailookup-link.genefoundry.org"]'
      SPLICEAILOOKUP_LINK_CORS_ORIGINS: https://spliceailookup-link.genefoundry.org
    # Expose-only behind the reverse proxy. !reset (not []) is required: Compose
    # MERGES list fields across -f overlays, so a plain `ports: []` would NOT drop
    # the base file's published "${SPLICEAILOOKUP_LINK_HOST_PORT:-8603}:8000" map.
    ports: !reset []
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped
    deploy: !override
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256
    healthcheck:
      test:
        ["CMD", "sh", "-c", "curl -f -H \"Host: $${GF_HEALTHCHECK_HOST}\" http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=spliceailookup-link,environment=production"
